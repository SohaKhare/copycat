[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SohaKhare", email = "sohaajaykhare2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk[extensions]>=2.8.0",
    "google-genai>=2.20.0",
    "mcp>=1.29,<2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyaudio>=0.2.14",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "supabase>=2.31.0",
    "tenacity>=8.0.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
